# ========================================
# Petal API – Application Configuration
# ========================================

# Server
server.port=8080

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/petal_db?sslmode=disable}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway schema migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT
jwt.secret=${JWT_SECRET:change-me-local-dev-only-change-before-shared-use}
jwt.expiration=86400000

# Storage
# local = filesystem fallback under /uploads/**
# supabase = Supabase Storage via backend service role key
petal.storage.provider=${STORAGE_PROVIDER:local}
petal.storage.local-upload-dir=${UPLOAD_DIR:uploads}
petal.storage.supabase-url=${SUPABASE_URL:}
petal.storage.supabase-service-key=${SUPABASE_SERVICE_ROLE_KEY:}
petal.storage.florist-logos-bucket=${SUPABASE_FLORIST_LOGOS_BUCKET:florist-logos}
petal.storage.order-photos-bucket=${SUPABASE_ORDER_PHOTOS_BUCKET:order-photos}
petal.storage.signed-url-expires-seconds=${SUPABASE_SIGNED_URL_EXPIRES_SECONDS:300}

# Logging
logging.level.com.petal=DEBUG
